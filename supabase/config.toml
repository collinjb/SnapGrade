project_id = "snapgrade"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "snapgrade://"
additional_redirect_urls = ["snapgrade://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Required for the app's zero-friction first launch.
enable_anonymous_sign_ins = true

# Zero-friction first launch: the app signs in anonymously before the first
# scan, then the same user can be upgraded to email later without losing rows.
[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[functions.grade-paper]
# Leave JWT verification on: the function must know which user to rate-limit.
verify_jwt = true
